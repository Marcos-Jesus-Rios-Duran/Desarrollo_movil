name: firabase_multimedia
description: "Aplicación multimedia con Firebase - Clean Architecture"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- INFRAESTRUCTURA CLOUD (Firebase) ---
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.6

  # --- MULTIMEDIA Y RENDIMIENTO ---
  # Contrato moderno de galería/cámara sin permisos invasivos
  image_picker: ^1.1.2
  # Compresión reactiva en cliente para reducir payload
  flutter_image_compress: ^2.5.1
  # Renderizado asíncrono y caché automático (Equivalente a Coil/Glide)
  cached_network_image: ^3.4.1

  # --- ARQUITECTURA Y UTILIDADES ---
  # Inyección de dependencias (Patrón Singleton)
  get_it: ^7.7.0
  # Gestor de estado (para tu Store/ViewModel)
  provider: ^6.1.2
  # Nombres únicos para prevenir sobreescrituras en Storage
  uuid: ^4.5.1
  # Para sobrescribir operadores de igualdad en los modelos
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
